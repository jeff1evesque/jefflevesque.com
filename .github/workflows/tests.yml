name: tests

##
## Push is scoped to the default branch. With a bare `push:` beside
## `pull_request:`, every commit on a branch with an open pull request fires
## this workflow twice and bills twice for the same answer -- see trivy.yml for
## the longer note. Branch work stays covered by `pull_request`, and the
## direct-to-master case by `push`.
##

on:
  push:
    branches: [master]
  pull_request:

jobs:
  jest:
    name: jest
    runs-on: ubuntu-latest

    ##
    ## 'contents: write' is what lets the publish step below push the badges
    ## branch using the built-in GITHUB_TOKEN. Declared explicitly rather than
    ## inherited: the default is read-only on newer repositories, and a token
    ## that cannot push fails the step with a 403 that reads like a credential
    ## problem rather than a permissions one.
    ##
    permissions:
      contents: write

    defaults:
      run:
        working-directory: jsx

    steps:
      - uses: actions/checkout@v4

      # jest 29 needs ^14.15 || ^16.10 || >=18, and @testing-library/react 16
      # wants a current runtime; node 20 matches the `lint` workflow so both
      # jobs run on one version.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 'npm install' rather than 'npm ci': package-lock.json is gitignored in
      # this repository (see .gitignore), so there is no lock file in the
      # checkout for 'npm ci' to read.
      #
      # Note: the full dependency tree is needed here, unlike the lint job which
      #       installs only eslint -- the tests import the real components, which
      #       pull in React, MUI, react-router and redux.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npx jest --config jest.config.js

      # The README badge is a shields.io 'endpoint' badge: shields fetches a small
      # JSON document at render time and draws whatever number it finds, so the
      # figure follows CI rather than someone's memory. This step rewrites that
      # document after every master build.
      #
      # Only from a push to master. On a branch or a pull request the badge would
      # otherwise advertise whatever was last pushed anywhere, and a pull request
      # from a fork gets a read-only token in any case.
      #
      # Note: what gets published is built by scripts/coverage_badge.py, which emits
      #       the overall statement percentage and refuses to emit anything holding a
      #       path or a source-file extension. That matters because the branch is
      #       PUBLIC and the report it is derived from is not: coverage-summary.json
      #       carries one absolute path per source file.
      #
      # Note: the destination is a branch in this repository rather than a gist,
      #       so the push authenticates with the built-in GITHUB_TOKEN. That token
      #       is minted for this run, scoped to this repository and expires with
      #       the job -- a gist needs a personal access token instead, which is a
      #       long-lived credential to store and rotate for no extra capability.
      #
      # Note: master itself cannot hold the file. The ruleset requires a pull
      #       request there and permits no bypass, and a badge that needs a review
      #       on every build is not published, it is hand-maintained. The ruleset
      #       targets the default branch only, so 'badges' is writable from here.
      - name: Publish the coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          payload="$(python3 ../scripts/coverage_badge.py coverage-summary.json)"
          echo "publishing: ${payload}"

          # Built from scratch in a temporary directory and force-pushed, so the
          # branch stays at one commit holding one file. Committing onto the
          # previous tip instead would add a commit per master build forever, and
          # an orphan branch keeps the source tree out of it entirely -- a copy of
          # master frozen on the day the branch was cut is worse than no copy.
          tmp="$(mktemp -d)"
          printf '%s' "${payload}" > "${tmp}/coverage.json"
          cd "${tmp}"

          git init -q
          git checkout -q --orphan badges
          git add coverage.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m 'coverage badge'

          # The token is interpolated into the remote rather than written to
          # .git/config, so it never lands on disk. Actions masks it in the log.
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            badges
