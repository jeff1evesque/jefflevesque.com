<!DOCTYPE html>
<html>
  <head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <script>
      // the theme to draw, on the page before anything is painted -- so a dark
      // page is never drawn light first: the reader's choice until it lapses,
      // and otherwise their own clock's, light from 7 in the morning until 7 in
      // the evening. theme-preference.js keeps the choice under this key.
      (function () {
        var theme = null;

        try {
          var stored = JSON.parse(window.localStorage.getItem('jefflevesque.theme'));

          if (stored && (stored.theme === 'light' || stored.theme === 'dark')
              && typeof stored.until === 'number' && stored.until > Date.now()) {
            theme = stored.theme;
          }
        } catch (e) {}

        if (!theme) {
          var hour = new Date().getHours();

          theme = hour >= 7 && hour < 19 ? 'light' : 'dark';
        }

        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel='stylesheet' href='/static/css/style.css'>
    <link rel='shortcut icon' href='#'>
  </head>
  <body>
    <div class='under-construction'>Site Under Construction</div>
    <div class='react-container' id='bootstrap-override'></div>
    <script src='/static/js/content.js'></script>
  </body>
</html>
